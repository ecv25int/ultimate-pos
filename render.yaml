services:
  - type: web
    name: ultimate-pos-api
    env: node
    rootDir: ultimate-pos-api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ultimate-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: ultimate-pos-web
    env: static
    rootDir: ultimate-pos-web
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist/ultimate-pos-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: redis
    name: ultimate-pos-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (render internal services)

databases:
  - name: ultimate-pos-db
    databaseName: ultimate_pos
    user: root
    plan: free
